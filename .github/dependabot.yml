version: 2
# This file is A material: authored here and exported verbatim to the public
# repo (SirBadfish/batshit), which is the only repo where it actually runs.
# The private dev repo has the whole Dependabot feature set switched off
# (dependency graph, alerts, security updates), so this config is inert there.
#
# Routine version-update PRs stay disabled via open-pull-requests-limit: 0.
# Security updates are NOT subject to that limit and are managed through the
# public repo's security settings, so they still open PRs. The security-updates
# group below bundles those into one PR per ecosystem+directory instead of one
# PR per vulnerable package, which is what kept the maintainer inbox noisy.
#
# Team-only package roots cannot be listed here because they are not part of
# the public repository. The private development workflow audits them
# separately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/batshit-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
      - "batshit-app"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/batshit-server/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
      - "batshit-server"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/batshit-mac"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:30"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
      - "mac-app"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/batshit-mac/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
      - "mac-app"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/tools/livekit-agent-sidecar"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:30"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
      - "voice-runtime"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
