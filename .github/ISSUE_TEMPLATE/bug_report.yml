name: Bug report
description: Report a reproducible Batshit bug
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please do not include API keys, secrets, raw private logs, or sensitive local files.

        If Batshit opens, go to Settings -> Admin -> Diagnostics, click Export Diagnostics, review the preview, then attach the downloaded diagnostics zip if you are comfortable sharing it. Diagnostics excludes chats, prompts, uploads, project files, backups, saved keys, tokens, cookies, raw Redis data, and n8n workflow contents by design.
  - type: dropdown
    id: setup
    attributes:
      label: Setup path
      options:
        - Mac app
        - Docker
        - Source checkout / contributor setup
        - Not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug in plain language.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Attach the diagnostics zip from Settings -> Admin -> Diagnostics if Batshit can open. Screenshots are also useful for visual bugs. Do not paste raw logs with secrets.
    validations:
      required: false
